<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CatChat</title>
    <link rel="icon" type="image/png" href="/images/favicon.png">
    <link rel="stylesheet" href="/css/style.css">

    <meta property="og:title" content="CatChat">
    <meta property="og:description" content="Enter a room code &amp; chat :3">
    <meta property="og:image" content="https://catchat.co.za/images/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
</head>
<body>
    <!-- Screen 1: login -->
    <form id="login" class="card">
        <h1>[ CatChat ]</h1>
        <p class="hint">Enter a room code. Anyone with the same code joins the same room. Messages are end-to-end encrypted with the code, so use a long one.</p>

        <label for="username">USERNAME</label>
        <input id="username" maxlength="20" placeholder="e.g. Mr. Robot" autocomplete="off" required>

        <label for="room">ROOM CODE</label>
        <input id="room" maxlength="100" placeholder="e.g. amber-otter-nebula-7391" autocomplete="off" required>

        <p id="error" class="error"></p>
        <button type="submit">CONNECT →</button>
    </form>

    <!-- Screen 2: chat (hidden until you join) -->
    <div id="chat" hidden>
        <aside>
            <div class="room">ROOM // <span id="room-name"></span></div>
            <div class="e2e">🔒 end-to-end encrypted</div>
            <div class="label">MEMBERS</div>
            <ul id="members"></ul>
            <button id="leave">← Leave room</button>
        </aside>
        <main>
            <div id="messages"></div>
            <form id="send">
                <input id="file" type="file" hidden>
                <button type="button" id="attach" title="Send a file (max 20 MB)">📎</button>
                <input id="text" placeholder="Type a message…" autocomplete="off">
                <button type="submit">➤</button>
            </form>
        </main>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/crypto.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
